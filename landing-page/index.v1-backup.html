    <link rel="stylesheet" href="src/sections/06-escala/escala.css" />

    <!-- Header e Navegação -->
    <div data-include="src/layout/header.html"></div>

    <!-- Seções da Landing Page -->

      <div data-include="src/sections/01-hero/hero.html"></div>
      <div data-include="src/sections/02-diagnostico/diagnostico.html"></div>
      <div data-include="src/sections/03-overview/overview.html"></div>

      <div data-include="src/sections/07-sorteio/sorteio.html"></div>
      <div data-include="src/sections/08-seguranca/seguranca.html"></div>
      <div data-include="src/sections/09-casos/casos.html"></div>
      <div data-include="src/sections/10-faq/faq.html"></div>
    </main>

    <!-- Footer -->
    <div data-include="src/layout/footer.html"></div>

    <!-- Carregador Modular sem Build (Fetch das Seções + Scripts) -->
    <script>
      (async function () {
        // 1. Carrega todas as seções assincronamente e substitui cada placeholder pelo HTML real
        const placeholders = Array.from(document.querySelectorAll("[data-include]"));
        for (const el of placeholders) {
          const file = el.getAttribute("data-include");
          try {
            const res = await fetch(file);
            if (res.ok) {
              const html = await res.text();
              el.outerHTML = html;
            }
          } catch (err) {
            console.error("Erro ao carregar seção:", file, err);
          }
        }

        // 2. Alternância automática de contraste entre as seções (tom claro / tom contraste)
        document.querySelectorAll("main > section").forEach((sec, idx) => {
          sec.classList.remove("section-contrast");
          if (idx % 2 === 1) {
            sec.classList.add("section-contrast");
          }
        });

        // 3. Carrega e executa os scripts modulares interativos após o DOM estar pronto
        const scripts = [
          "src/sections/03-overview/overview.js",
          "src/sections/04-propostas/propostas.js",
          "src/sections/05-simulador/simulador.js",
          "src/sections/07-sorteio/sorteio.js",
        ];

        for (const src of scripts) {
          await new Promise((resolve) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = resolve;
            document.body.appendChild(script);
          });
        }

        // 4. Suporte a âncoras na URL na inicialização (ex: #simulador, #escala)
        if (window.location.hash) {
          const target = document.querySelector(window.location.hash);
          if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: "smooth" }), 100);
          }
        }

        // 5. Atualização dinâmica da âncora na URL conforme o scroll (ScrollSpy suave sem poluir o histórico)
        const trackedSections = Array.from(document.querySelectorAll("main > section[id]"));
        const navLinks = Array.from(document.querySelectorAll(".main-nav a[href^='#']"));

        if (trackedSections.length > 0) {
          let currentActiveHash = window.location.hash || "#hero";
          let isThrottled = false;

          function updateNavState(id) {
            navLinks.forEach((link) => {
              const hrefId = link.getAttribute("href").replace("#", "");
              if (hrefId === id) {
                link.classList.add("active");
              } else {
                link.classList.remove("active");
              }
            });
          }

          function onScrollSpy() {
            const scrollY = window.scrollY;
            const headerOffset = 130;

            // Topo da página: Hero
            if (scrollY < 200) {
              if (currentActiveHash !== "#hero") {
                currentActiveHash = "#hero";
                history.replaceState(null, null, "#hero");
                updateNavState("hero");
              }
              return;
            }

            // Fim da página: última seção
            if (window.innerHeight + scrollY >= document.documentElement.scrollHeight - 60) {
              const lastSec = trackedSections[trackedSections.length - 1];
              if (lastSec && currentActiveHash !== `#${lastSec.id}`) {
                currentActiveHash = `#${lastSec.id}`;
                history.replaceState(null, null, currentActiveHash);
                updateNavState(lastSec.id);
              }
              return;
            }

            // Identifica qual seção está na linha de leitura
            let visibleSection = null;
            for (const section of trackedSections) {
              const top = section.offsetTop - headerOffset;
              const height = section.offsetHeight;
              if (scrollY >= top && scrollY < top + height) {
                visibleSection = section;
                break;
              }
            }

            if (visibleSection) {
              const newHash = `#${visibleSection.id}`;
              if (currentActiveHash !== newHash) {
                currentActiveHash = newHash;
                history.replaceState(null, null, newHash);
                updateNavState(visibleSection.id);
              }
            }
          }

          window.addEventListener(
            "scroll",
            () => {
              if (!isThrottled) {
                window.requestAnimationFrame(() => {
                  onScrollSpy();
                  isThrottled = false;
                });
                isThrottled = true;
              }
            },
            { passive: true }
          );

          // Executa na inicialização após breve timeout
          setTimeout(onScrollSpy, 250);
        }
      })();
    </script>
  </body>
</html>
